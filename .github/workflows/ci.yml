name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @reeldiff/example-next-app exec playwright install --with-deps chromium firefox webkit
      - run: pnpm lint
      - run: pnpm build
      - name: The committed action bundle matches the source
        run: git diff --exit-code packages/action/dist
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: examples/next-app/test-results/
          if-no-files-found: ignore
