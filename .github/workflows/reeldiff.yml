name: Reeldiff

on:
  pull_request:
    paths:
      - "examples/next-app/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reeldiff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build the example app at the PR base
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          cd ../base
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@reeldiff/example-next-app

      - name: Serve head on 3100 and base on 3101
        run: |
          (cd examples/next-app && nohup pnpm exec next start --port 3100 > /tmp/head.log 2>&1 &)
          (cd ../base/examples/next-app && nohup pnpm exec next start --port 3101 > /tmp/base.log 2>&1 &)
          for port in 3100 3101; do
            for i in $(seq 60); do curl -sf "http://localhost:$port/dashboard" > /dev/null && break; sleep 1; done
          done

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - uses: ./packages/action
        id: reeldiff
        with:
          head-url: http://localhost:3100
          base-url: http://localhost:3101
          working-directory: examples/next-app
          cli: node ../../packages/cli/dist/cli.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reeldiff-run
          path: examples/next-app/.reeldiff/out/
          if-no-files-found: ignore
